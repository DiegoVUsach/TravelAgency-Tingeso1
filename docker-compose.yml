version: "3.8"

services:
  # =============================================================
  # MySQL Database
  # =============================================================
  db:
    image: mysql:8.0
    container_name: travelagency-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: clave1234
      MYSQL_DATABASE: TravelAgency
    ports:
      - "3307:3306"
    volumes:
      - db-data:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d:ro
    networks:
      - travelagency-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pclave1234"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # =============================================================
  # Keycloak IAM (v26.2 — no /auth/ prefix)
  # =============================================================
  keycloak:
    image: quay.io/keycloak/keycloak:26.2
    container_name: travelagency-keycloak
    restart: unless-stopped
    command: start-dev
    environment:
      KC_DB: mysql
      KC_DB_URL: jdbc:mysql://db:3306/keycloak
      KC_DB_USERNAME: root
      KC_DB_PASSWORD: clave1234
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
    ports:
      - "9090:8080"
    networks:
      - travelagency-net
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8080 && echo -e 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && timeout 2 cat <&3 | grep -q 'UP'"]
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 90s

  # =============================================================
  # Backend — Replica 1
  # =============================================================
  backend-1:
    image: diegovfusach/travelagency-backend:latest
    container_name: travelagency-backend-1
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: TravelAgency
      DB_USERNAME: root
      DB_PASSWORD: clave1234
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: travelagency-realm
    networks:
      - travelagency-net
    depends_on:
      db:
        condition: service_healthy
      keycloak:
        condition: service_healthy

  # =============================================================
  # Backend — Replica 2
  # =============================================================
  backend-2:
    image: diegovfusach/travelagency-backend:latest
    container_name: travelagency-backend-2
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: TravelAgency
      DB_USERNAME: root
      DB_PASSWORD: clave1234
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: travelagency-realm
    networks:
      - travelagency-net
    depends_on:
      db:
        condition: service_healthy
      keycloak:
        condition: service_healthy

  # =============================================================
  # Backend — Replica 3
  # =============================================================
  backend-3:
    image: diegovfusach/travelagency-backend:latest
    container_name: travelagency-backend-3
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: TravelAgency
      DB_USERNAME: root
      DB_PASSWORD: clave1234
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: travelagency-realm
    networks:
      - travelagency-net
    depends_on:
      db:
        condition: service_healthy
      keycloak:
        condition: service_healthy

  # =============================================================
  # Frontend — React SPA (served by Nginx)
  # =============================================================
  frontend:
    image: diegovfusach/travelagency-frontend:latest
    container_name: travelagency-frontend
    restart: unless-stopped
    networks:
      - travelagency-net

  # =============================================================
  # Nginx — Load Balancer & Reverse Proxy
  # =============================================================
  nginx:
    image: nginx:1.27-alpine
    container_name: travelagency-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - travelagency-net
    depends_on:
      - backend-1
      - backend-2
      - backend-3
      - frontend

volumes:
  db-data:

networks:
  travelagency-net:
    driver: bridge
