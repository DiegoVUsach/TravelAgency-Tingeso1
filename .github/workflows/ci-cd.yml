name: CI/CD Pipeline — Build, Test & Push Docker Images

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # -------------------------------------------------------
      # 1. Checkout source code
      # -------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # -------------------------------------------------------
      # 2. Setup Java 17 + Maven cache
      # -------------------------------------------------------
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: Backend/pom.xml

      # -------------------------------------------------------
      # 3. Build backend + Run JUnit tests (with JaCoCo)
      # -------------------------------------------------------
      - name: Build & Test Backend
        run: mvn clean package
        working-directory: Backend

      # -------------------------------------------------------
      # 4. Setup Node 20 + npm cache
      # -------------------------------------------------------
      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: Frontend/frontend/package-lock.json

      # -------------------------------------------------------
      # 5. Build frontend (npm install + npm run build)
      # -------------------------------------------------------
      - name: Install frontend dependencies
        run: npm ci
        working-directory: Frontend/frontend

      - name: Build frontend
        run: npm run build
        working-directory: Frontend/frontend
        env:
          VITE_API_URL: /api/v1
          VITE_KEYCLOAK_URL: /

      # -------------------------------------------------------
      # 6. Login to DockerHub
      # -------------------------------------------------------
      - name: Login to DockerHub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # -------------------------------------------------------
      # 7. Build & Push Backend Docker image
      # -------------------------------------------------------
      - name: Build Backend Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker build -t diegovfusach/travelagency-backend:latest .
        working-directory: Backend

      - name: Push Backend Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker push diegovfusach/travelagency-backend:latest

      # -------------------------------------------------------
      # 8. Build & Push Frontend Docker image
      # -------------------------------------------------------
      - name: Build Frontend Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker build -t diegovfusach/travelagency-frontend:latest .
        working-directory: Frontend/frontend

      - name: Push Frontend Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker push diegovfusach/travelagency-frontend:latest
