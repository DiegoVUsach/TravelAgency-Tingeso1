spring.application.name=demo
server.port = 8080
# 1. La URL de conexión (El puerto 3306 es el que dejaste por defecto)
# El "?createDatabaseIfNotExist=true" hace magia: crea la base de datos por ti si no existe.
spring.datasource.url=jdbc:mysql://localhost:3306/mi_proyecto_db?createDatabaseIfNotExist=true

# 2. Tus credenciales de MySQL
spring.datasource.username=root
spring.datasource.password=clave1234

# 3. El driver para que Java sepa cómo hablar con MySQL
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 4. Configuración de JPA / Hibernate
# "update" lee tus entidades (como tu BundleEntity) y crea o actualiza las tablas automáticamente
spring.jpa.hibernate.ddl-auto=update

# (Opcional) Esto imprime en la consola las consultas SQL que Spring hace por debajo
spring.jpa.show-sql=true