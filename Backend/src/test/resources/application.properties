# Test configuration - overrides main application.properties

# Use H2 in-memory database for tests
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

# Disable data.sql for tests
spring.sql.init.mode=never

# Disable Keycloak/OAuth2 resource server (mock JWT in tests)
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://mock-issuer.example.com
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=https://mock-issuer.example.com/.well-known/jwks.json

# Disable scheduling to avoid @Scheduled tasks running in tests
spring.task.scheduling.enabled=false
