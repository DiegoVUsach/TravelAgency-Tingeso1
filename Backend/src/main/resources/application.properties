spring.application.name=demo
server.port = 8080 
# http://localhost:8080

# Connection URL
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:TravelAgency}

# Credentials
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:clave1234}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Keycloak configuration
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_URL:http://localhost:9090}/realms/${KEYCLOAK_REALM:travelagency-realm}

spring.security.oauth2.client.registration.keycloak.client-id=${KEYCLOAK_CLIENT_ID:travelagency-backend}
spring.security.oauth2.client.registration.keycloak.client-secret=${KEYCLOAK_CLIENT_SECRET:08s0kH9En0SYKYuHNe4TPsvtl1qdPi0s}
spring.security.oauth2.client.registration.keycloak.scope=openid,profile,email
spring.security.oauth2.client.registration.keycloak.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.keycloak.redirect-uri=${KEYCLOAK_URL:http://localhost:9090}/login/oauth2/code/keycloak
spring.security.oauth2.client.provider.keycloak.issuer-uri=${KEYCLOAK_URL:http://localhost:9090}/realms/${KEYCLOAK_REALM:travelagency-realm}

# Check later if this is needed
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Config for data.sql
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true
